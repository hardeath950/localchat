# Build com o toolchain GNU do MSYS2 (nao depende da MSVC). Use
# scripts\build-windows.ps1 (ele escolhe o toolchain stable-x86_64-pc-windows-gnu).
# CRT estatico => binario avulso, sem DLLs do mingw na maquina de destino.
[build]
target = "x86_64-pc-windows-gnu"

[target.x86_64-pc-windows-gnu]
linker = "C:/msys64/mingw64/bin/gcc.exe"
# dlltool: crates com raw-dylib (ex.: chrono) geram libs de importacao com ele
rustflags = ["-C", "target-feature=+crt-static", "-C", "dlltool=C:/msys64/mingw64/bin/dlltool.exe"]