[package]
name = "localchat"
version = "0.1.0"
edition = "2021"
description = "Chat e transferencia de arquivos na LAN, criptografado ponto a ponto"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
eframe = "0.37.0"
hex = "0.4"
rand = "0.8"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tray-icon = "0.26.1"

[profile.release]
lto = "thin"

# tray-icon 0.26.1 com patch local: Shell_NotifyIconGetRect falha em alguns
# builds do Windows 11 e o crate descartava todos os eventos do tray.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
