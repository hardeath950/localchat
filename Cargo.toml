[package]
name = "localchat"
version = "0.2.0"
edition = "2021"
description = "Chat e transferencia de arquivos na LAN, criptografado ponto a ponto"
repository = "https://github.com/hardeath950/localchat"
license = "MIT"
# nao vai para o crates.io: so GitHub Releases (ver release-plz.toml)
publish = false

[dependencies]
anyhow = "1"
# horario local das mensagens (fuso do sistema no Windows e no Linux)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
eframe = "0.37.0"
hex = "0.4"
# update automatico: baixa do GitHub Releases (TLS em Rust puro, sem OpenSSL) e
# so aceita manifesto assinado com a chave minisign do projeto
minisign-verify = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }
ureq = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17.2"
tray-icon = "0.26.1"

# no Linux o seletor de arquivos usa GTK (o backend xdg-portal e fragil no sync;
# sem default-features porque o rfd recusa gtk3 + xdg-portal juntos)
# e a bandeja usa ksni (D-Bus puro): o backend padrao (appindicator) exige um
# loop GTK na thread, que o eframe/winit nao tem
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
lto = "thin"

# tray-icon 0.26.1 com patch local: Shell_NotifyIconGetRect falha em alguns
# builds do Windows 11 e o crate descartava todos os eventos do tray.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
