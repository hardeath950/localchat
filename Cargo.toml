[package]
name = "localchat"
version = "0.1.0"
edition = "2021"
description = "Chat e transferencia de arquivos na LAN, criptografado ponto a ponto"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
